services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nature_grid
      POSTGRES_USER: nature_grid
      POSTGRES_PASSWORD: nature_grid
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:

