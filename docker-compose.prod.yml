# Production stack — all four services in one compose file.
#
# Required env vars (set in a .env file or your deployment platform):
#   POSTGRES_PASSWORD   — database password (required, no default)
#   JWT_SECRET          — API signing key, ≥32 chars (required, no default)
#
# Optional env vars with defaults:
#   POSTGRES_DB         — database name       (default: nature_grid)
#   POSTGRES_USER       — database user       (default: nature_grid)
#   CORS_ORIGIN         — allowed origins     (default: http://localhost:3000)
#   API_URL             — internal API URL    (default: http://api:3001)
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / SMTP_FROM  — email (optional)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f api

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-nature_grid}
      POSTGRES_USER:     ${POSTGRES_USER:-nature_grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nature_grid} -d ${POSTGRES_DB:-nature_grid}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    # Not exposed to host in production — only reachable by other services
    # Uncomment the line below for emergency direct access:
    # ports: ["5432:5432"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-nature_grid}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nature_grid}?schema=public
      JWT_SECRET:   ${JWT_SECRET}
      PORT:         3001
      CORS_ORIGIN:  ${CORS_ORIGIN:-http://localhost:3000}
      SMTP_HOST:    ${SMTP_HOST:-}
      SMTP_PORT:    ${SMTP_PORT:-587}
      SMTP_USER:    ${SMTP_USER:-}
      SMTP_PASS:    ${SMTP_PASS:-}
      SMTP_FROM:    ${SMTP_FROM:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side only — no NEXT_PUBLIC_ prefix needed
      API_URL:  ${API_URL:-http://api:3001}
      PORT:     3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      API_URL:  ${API_URL:-http://api:3001}
      PORT:     3002
      HOSTNAME: 0.0.0.0
    ports:
      - "3002:3002"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
